name: PR checks

on:
  pull_request:
    paths:
      - 'posts/**'
      - 'src/**'
      - 'writing/**'
      - 'package.json'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mcp/**'
      - '.github/workflows/**'
      - 'next.config.ts'
      - 'vitest.config.mts'
      - 'tsconfig.json'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck MCP Worker
        run: pnpm mcp:typecheck

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Lint changed posts
        shell: bash
        env:
          TAHRIRCHI_API_KEY: ${{ secrets.TAHRIRCHI_API_KEY }}
        run: |
          git diff --name-only --diff-filter=AMR "origin/${{ github.base_ref }}...HEAD" -- 'posts/*.md' \
            | xargs -r -d '\n' pnpm yozma:check
